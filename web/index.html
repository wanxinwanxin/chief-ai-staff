<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chief of AI Staff</title>
  <meta name="description" content="Every agent team on every machine, live, and the agenda for your meeting with the chief.">
  <meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Chief">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <h1>Chief of AI Staff</h1>
        <p class="sync" id="sync">Loading…</p>
      </div>
    </div>
    <div class="controls">
      <div class="segmented" role="radiogroup" aria-label="Time range" id="range">
        <button role="radio" data-range="24h">24h</button>
        <button role="radio" data-range="7d">7d</button>
        <button role="radio" data-range="30d">30d</button>
      </div>
      <button class="icon-btn" id="refresh" title="Refresh now" aria-label="Refresh now">↻</button>
      <button class="icon-btn" id="theme" title="Switch theme" aria-label="Switch theme">◐</button>
    </div>
  </header>

  <main id="app" class="app">
    <section class="card live" id="live"></section>
    <section class="grid-top">
      <article class="card agenda" id="agenda"></article>
      <article class="card focus" id="focus"></article>
    </section>
    <section class="tiles" id="tiles"></section>
    <section class="card org-card">
      <div class="card-head">
        <h2>Org chart</h2>
        <p class="hint">Click a department for details. Click an agent to jump to its tab.</p>
      </div>
      <div class="org" id="org"></div>
    </section>
    <section class="grid-charts">
      <article class="card">
        <div class="card-head"><h2>Spend by department</h2><p class="hint" id="spend-hint"></p></div>
        <div id="bars" class="chart"></div>
      </article>
      <article class="card">
        <div class="card-head"><h2>Spend over time</h2><p class="hint" id="time-hint"></p></div>
        <div id="legend" class="legend"></div>
        <div id="columns" class="chart"></div>
      </article>
    </section>
    <section class="card table-card">
      <div class="card-head"><h2>Departments</h2><button class="btn" id="table-toggle"></button></div>
      <div id="table" class="table-wrap"></div>
    </section>
    <p class="footnote" id="note"></p>
  </main>

  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-inner" id="drawer-body"></div>
  </aside>
  <div class="tooltip" id="tooltip" role="status" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
